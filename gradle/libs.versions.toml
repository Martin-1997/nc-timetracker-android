retrofit = "3.0.0"
okhttp = "5.5.1"
kotlinxSerializationJson = "1.13.0"
retrofitKotlinxSerializationConverter = "1.0.0"
room = "2.8.5"
securityCrypto = "1.1.0"
browser = "1.10.0"
