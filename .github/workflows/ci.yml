name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # This is the first real compilation gate for this project: the
    # environment this codebase was originally scaffolded in had no
    # x86_64 Android build-tools emulation available, so nothing here has
    # been compiled yet. Expect (and fix) build errors on the first runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck

      - name: Static analysis (detekt)
        run: ./gradlew detekt

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
