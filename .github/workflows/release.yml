name: Release

# PLAN.md §6: tag -> signed release APK -> GitHub Release (+ F-Droid, which
# builds from source against this same tag and doesn't need a CI step here)
# + an optional Play upload job, gated on Play Console secrets actually
# being configured so this workflow still runs to completion for
# forks/before those secrets exist.
on:
  push:
    tags:
      - 'v*'

jobs:
  build-signed-release:
    runs-on: ubuntu-latest
    # Creating a GitHub Release needs contents: write — the default
    # GITHUB_TOKEN is read-only unless a repo/org sets otherwise, so this
    # is declared explicitly rather than relying on that repo setting.
    permissions:
      contents: write
    outputs:
      version-name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Same gates as ci.yml — a release build skips nothing.
      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck

      - name: Static analysis (detekt)
        run: ./gradlew detekt

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore

      # Mirrors keystore.properties.example's shape — see app/build.gradle.kts's
      # requiredSigningProperty() for what happens if any of these are blank.
      - name: Write keystore.properties
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=${{ github.workspace }}/release.keystore
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Assemble signed release APK
        run: ./gradlew assembleRelease

      - name: Remove keystore material
        if: always()
        run: rm -f release.keystore keystore.properties

      - name: Determine version name
        id: version
        run: |
          name=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.name }} (${{ github.ref_name }})
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true

  publish-play-store:
    needs: build-signed-release
    runs-on: ubuntu-latest
    # Only runs once PLAY_SERVICE_ACCOUNT_JSON is actually configured (repo
    # secret) — until then this job is skipped rather than failing the
    # whole release, so GitHub Releases + F-Droid still ship on their own.
    if: ${{ vars.PLAY_PUBLISHING_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release

      - name: Write Play Console service account key
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "$PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json

      - name: Publish to Play Store (internal track)
        run: ./gradlew publishReleaseApk

      - name: Remove service account key
        if: always()
        run: rm -f play-service-account.json
